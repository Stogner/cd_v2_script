name: Build Windows app

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to attach the .exe to a release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Check that the app imports on Windows
        run: python -c "import app, main, gui, logic, listener, icon"

      - name: Build ConsoleDeck.exe
        run: python build_exe.py

      - uses: actions/upload-artifact@v4
        with:
          name: ConsoleDeck
          path: dist/ConsoleDeck.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ConsoleDeck.exe
